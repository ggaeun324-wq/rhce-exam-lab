server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 덤프/문제 폴더는 목록 보기 허용
    location /questions/ {
        alias /srv/questions/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
