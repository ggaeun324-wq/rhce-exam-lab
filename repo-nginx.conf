user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;

    proxy_cache_path /var/cache/nginx/rocky levels=1:2 keys_zone=rocky:50m
                     max_size=8g inactive=30d use_temp_path=off;

    server {
        listen 80 default_server;
        server_name content classroom materials utility download redhat.example.com rhgls.domain1.example.com _;

        location = / {
            default_type text/plain;
            return 200 "RHCE lab repo/materials server\nrepo:  /repo/{BaseOS,AppStream}  /rhel9.0/x86_64/dvd/{BaseOS,AppStream}  /os/{BaseOS,AppStream}\ngpg:   /rhel/rhel-gpg-key\nfiles: /materials/  /material/  /download/\n";
        }

        # RPM GPG key (여러 경로 별칭)
        location = /rhel/rhel-gpg-key { alias /srv/materials/RPM-GPG-KEY-redhat-release; }
        location = /rhel9.0/x86_64/dvd/RPM-GPG-KEY-redhat-release { alias /srv/materials/RPM-GPG-KEY-redhat-release; }

        # materials / 파일 서빙 (3개 덤프 경로 모두)
        location /materials/ { alias /srv/materials/; autoindex on; }
        location /material/  { alias /srv/materials/; autoindex on; }
        location /download/  { alias /srv/materials/; autoindex on; }

        # BaseOS 미러 (프록시 캐시). /repo /rhel9.0/x86_64/dvd /os 경로 모두 허용, 대소문자 무시.
        location ~* ^/(?:os|repo|rhel9\.0/x86_64/dvd)/BaseOS/(?<rpath>.*)$ {
            rewrite ^ /rocky/9/BaseOS/x86_64/os/$rpath break;
            proxy_pass https://mirror.rackspace.com;
            proxy_set_header Host mirror.rackspace.com;
            proxy_ssl_name mirror.rackspace.com;
            proxy_ssl_server_name on;
            proxy_cache rocky;
            proxy_cache_valid 200 206 7d;
            proxy_cache_valid 404 1m;
            add_header X-Cache $upstream_cache_status;
            set $nocache 0;
            if ($uri ~* /repodata/) { set $nocache 1; }
            proxy_cache_bypass $nocache;
            proxy_no_cache $nocache;
        }

        # AppStream 미러
        location ~* ^/(?:os|repo|rhel9\.0/x86_64/dvd)/AppStream/(?<apath>.*)$ {
            rewrite ^ /rocky/9/AppStream/x86_64/os/$apath break;
            proxy_pass https://mirror.rackspace.com;
            proxy_set_header Host mirror.rackspace.com;
            proxy_ssl_name mirror.rackspace.com;
            proxy_ssl_server_name on;
            proxy_cache rocky;
            proxy_cache_valid 200 206 7d;
            proxy_cache_valid 404 1m;
            add_header X-Cache $upstream_cache_status;
            set $nocache 0;
            if ($uri ~* /repodata/) { set $nocache 1; }
            proxy_cache_bypass $nocache;
            proxy_no_cache $nocache;
        }
    }
}
